<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista</title>
        <script>
            function n_maior(num1, num2){
                if (num1 > num2){
                    alert(num1 + ' é maior')
                }else if(num1 < num2){
                    alert(num2 + ' é maior')
                }else{
                    alert('Os dois numeros são iguais')
                }
            } 

            var num1 = Number(prompt('Primeiro número:'))
            var num2 = Number(prompt('Segundo número: '))
            n_maior(num1, num2)
            
        </script>
    </head>
    <body>
        
    </body>
</html>
