        <title>Lista</title>
        <script>
                function somar(lista){
                    var soma = 0
                    var i = 0
                    while( i < lista.length){
                        soma = som + lista[i]
                        i = i + 1
                    }
                    alert('Soma: ' + soma)
                }

                var numeros = [3, 5, 10, 15, 30]
                somar(numeros)
            
        </script>
